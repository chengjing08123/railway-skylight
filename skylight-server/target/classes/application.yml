server:
  port: 8080

spring:
  application:
    name: skylight-server
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/railway_skylight?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: root
    password: ####    # ← 改成你的 MySQL 密码

mybatis:
  mapper-locations: classpath:mapper/*.xml          # Mapper XML 位置（后面会建）
  type-aliases-package: com.skylight.entity          # 实体别名包
  configuration:
    map-underscore-to-camel-case: true              # 下划线列名自动映射驼峰字段（work_unit_code → workUnitCode）
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl   # 控制台打印 SQL，调试用
