# railway-skylight 独立 Nginx 站点配置。
# 该配置不修改系统 Nginx，也不会影响默认 nginx.conf。

worker_processes  1;

events {
    worker_connections  1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;

    log_format  skylight  '$remote_addr - $remote_user [$time_local] "$request" '
                          '$status $body_bytes_sent "$http_referer" '
                          '"$http_user_agent" "$http_x_forwarded_for"';

    access_log  logs/skylight-access.log  skylight;
    error_log   logs/skylight-error.log   warn;

    sendfile        on;
    keepalive_timeout  65;
    server_tokens   off;

    gzip on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    server {
        listen       8088;
        server_name  localhost 127.0.0.1;

        root   html/skylight;
        index  index.html;

        # 健康检查用于确认 Nginx 站点已经启动。
        location = /healthz {
            access_log off;
            default_type text/plain;
            return 200 "nginx-ok\n";
        }

        # 前端默认请求 /api/conflicts；同源代理到 Spring Boot 的 8080 端口。
        # 后端未启动时返回一个可解析的 JSON 状态对象，前端会自动切换到演示数据。
        location /api/ {
            proxy_pass         http://127.0.0.1:8080;
            proxy_http_version 1.1;
            proxy_set_header   Host $host;
            proxy_set_header   X-Real-IP $remote_addr;
            proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_connect_timeout 3s;
            proxy_read_timeout    30s;
            proxy_intercept_errors on;
            error_page 502 503 504 =200 /backend-unavailable.json;
        }

        location = /backend-unavailable.json {
            internal;
            default_type application/json;
            return 200 '{"status":"backend_unavailable"}';
        }

        # hash 路由由浏览器处理；这里只需要保证静态入口可访问。
        location / {
            try_files $uri $uri/ /index.html;
        }

        location = /index.html {
            add_header Cache-Control "no-store";
            add_header X-Content-Type-Options "nosniff";
            add_header Referrer-Policy "same-origin";
        }

        location ~ /\. {
            deny all;
        }
    }
}
